name: Deploy 109 PRO to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare source folder
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          elif [[ -f 109-PRO-Source.zip ]]; then
            mkdir -p source
            unzip -q 109-PRO-Source.zip -d source
            echo "APP_DIR=source" >> "$GITHUB_ENV"
          else
            echo "Could not find package.json or 109-PRO-Source.zip" >&2
            exit 1
          fi
      - name: Configure GitHub Pages base path
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${REPO_NAME}/" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: cd "$APP_DIR" && npm ci
      - name: Build 109 PRO
        run: cd "$APP_DIR" && npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
